
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise - Budget Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>SpendWise</h1>
        <p>Track your income and expenses in one place</p>
    </header>

    <main class="container">

        <section class="summary">
            <div class="card">
                <h3>Total Income</h3>
                <p id="income">KSh 0</p>
            </div>

            <div class="card">
                <h3>Total Expenses</h3>
                <p id="expenses">KSh 0</p>
            </div>

            <div class="card">
                <h3>Balance</h3>
                <p id="balance">KSh 0</p>
            </div>
        </section>

        <section class="form-section">
            <h2>Add Transaction</h2>

            <form id="transactionForm">
                <input type="text" id="name"
                    placeholder="Transaction name" required>

                <input type="number" id="amount"
                    placeholder="Amount in KSh" min="0.01"
                    step="0.01" required>

                <select id="type" required>
                    <option value="expense">Expense</option>
                    <option value="income">Income</option>
                </select>

                <select id="category" required>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Rent">Rent</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Utilities">Utilities</option>
                    <option value="Other">Other</option>
                </select>

                <button type="submit">Add Transaction</button>
            </form>
        </section>

        <section class="table-section">
            <h2>Transaction History</h2>

            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Amount</th>
                        <th>Category</th>
                        <th>Date</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="transactionList">
                    <tr>
                        <td colspan="5">No transactions yet.</td>
                    </tr>
                </tbody>
            </table>
        </section>

    </main>

    <footer>
        <p>© 2026 SpendWise Budget Tracker</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
